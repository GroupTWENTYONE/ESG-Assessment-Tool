<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG Chatbot</title>
    <link rel="stylesheet" href="styles/default-style.css">
</head>
<body>
    <div class="body-container">
        <header class="label">ESG Chatbot</header>
        <div class="chat-main-section">
            <div id="chat-messages" class="chat-text">
                <div class="message machine">...</div>
            </div>
            
            <div class="chat-input-section">
                <input id="user-message" class="chat-input" type="text" placeholder="Ask me something" />
                <button class="submit-button" onclick="send()">></button>
            </div>
        </div>        
    </div>

    <script src="script.js"></script>
</body>
</html>
